# API only. The memory database and authentication use the user's Supabase project.
# Applying this paid service can incur Render charges. Model execution is separate.
services:
  - type: web
    name: teravs-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: OLLAMA_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TERAVS_MODEL
        value: qwen3:4b
      - key: TERAVS_DB
        value: /tmp/teravs.sqlite
